spring:
  application:
    name: team-service

  datasource:
    url: jdbc:postgresql://localhost:5432/teams_db
    username: postgres
    password: 12345678

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  server:
    port: 8082

grpc:
  server:
    port: 9091